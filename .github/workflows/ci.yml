name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out KOFever
        uses: actions/checkout@v4

      # The tests use the real MD5 implementation from koreader-base.
      - name: Check out ffi/sha2.lua from koreader-base
        uses: actions/checkout@v4
        with:
          repository: koreader/koreader-base
          ref: 51d5eec06b413a1deefb4c4786253d03c349dcf2
          path: koreader-base
          sparse-checkout: ffi/sha2.lua
          sparse-checkout-cone-mode: false

      - name: Install LuaJIT, luacheck and dkjson
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check lua-dkjson

      - name: Lint
        run: luacheck kofever.koplugin tests

      # release.yml replaces this line with the release tag.
      - name: Check version placeholder
        run: grep -q '^local version = "dev"$' kofever.koplugin/_meta.lua

      - name: Run tests
        env:
          KOREADER_BASE: koreader-base
        run: luajit tests/run_tests.lua

  # On pull requests, build an installable test package once the tests pass, and link it from
  # the pull request. GitHub serves artifacts as a zip, so the download contains the
  # kofever.koplugin folder ready to copy into koreader/plugins/.
  package:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # For pull requests this checks out the result of merging the PR into its base branch.
      - name: Check out KOFever
        uses: actions/checkout@v4

      # pr<number>-<short commit>: only letters, digits and '-', so safe in a Lua string and a file name.
      - name: Stamp version
        run: |
          VERSION="pr${PR_NUMBER}-${HEAD_SHA:0:7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s|^local version = \"dev\"$|local version = \"$VERSION\"|" kofever.koplugin/_meta.lua
          grep -q "^local version = \"$VERSION\"$" kofever.koplugin/_meta.lua

      # Copy the plugin folder without hidden files, then add the licence.
      - name: Stage plugin folder
        run: |
          mkdir -p package
          tar --exclude='.*' -cf - kofever.koplugin | tar -C package -xf -
          cp LICENSE package/kofever.koplugin/LICENSE

      - name: Upload test package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: KOFever-${{ env.VERSION }}
          path: package/
          retention-days: 14
          if-no-files-found: error

      # Forked pull requests get a read-only token, so only comment on branches in this repository.
      - name: Link the package from the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- kofever-test-package -->';
            const body = [
              marker,
              `**Test package:** [KOFever-${process.env.VERSION}](${process.env.ARTIFACT_URL})`,
              '',
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)} merged into \`${context.payload.pull_request.base.ref}\`. ` +
              'Download (you need to be signed in to GitHub), extract, and copy the `kofever.koplugin` folder into ' +
              '`koreader/plugins/` on the device, replacing the old one. The version shows in Plugin management. ' +
              'The package expires after 14 days; this comment is updated on every push.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
